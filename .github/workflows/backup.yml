name: Backup diario

on:
  schedule:
    # 06:00 UTC todos los días (ajustá la hora si te conviene otra)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /cron/backup
        run: |
          status=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/cron/backup?secret=${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/respuesta.json
          if [ "$status" != "200" ]; then
            echo "El backup falló"
            exit 1
          fi
